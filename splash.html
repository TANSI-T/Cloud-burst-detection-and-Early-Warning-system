<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .video-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      transform: scale(1.06);
      transform-origin: center center;
    }
    @media (max-width: 768px) {
      video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        transform: scale(1.03);
      }
    }
    .tap-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="video-wrap">
    <video id="introVideo" autoplay playsinline webkit-playsinline preload="auto">
      <source src="/intro-video" type="video/mp4" />
    </video>
  </div>
  <div id="tapOverlay" class="tap-overlay">Tap to play video with sound</div>

  <script>
    const video = document.getElementById("introVideo");
    const tapOverlay = document.getElementById("tapOverlay");

    video.muted = false;
    video.volume = 1.0;

    const playPromise = video.play();
    if (playPromise) {
      playPromise.catch(() => {
        tapOverlay.style.display = "flex";
      });
    }

    tapOverlay.addEventListener("click", async () => {
      video.muted = false;
      try {
        await video.play();
        tapOverlay.style.display = "none";
      } catch (_) {
        // Keep overlay visible until browser allows interaction-based play.
      }
    });

    video.addEventListener("ended", () => {
      window.location.href = "/dashboard";
    });

    // Fallback: if autoplay is blocked or video fails, continue anyway.
    video.addEventListener("error", () => {
      window.location.href = "/dashboard";
    });
  </script>
</body>
</html>
